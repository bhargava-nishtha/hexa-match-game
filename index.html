<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexa-Match: Daily Gravity Grid</title>
    
    <!-- Premium SEO Optimization Meta Tags -->
    <meta name="description" content="Play Hexa-Match, the ultimate daily isometric physics puzzle game. Match colors, beat the gravity grid, and challenge your friends!">
    <meta property="og:title" content="Hexa-Match: Daily Gravity Grid">
    <meta property="og:description" content="Can you beat my score on today's gravity grid puzzle?">
    <meta property="og:type" content="website">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; padding: 20px; }
        #game-container { position: relative; width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; }
        header { text-align: center; margin-bottom: 15px; }
        h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #score-board { font-size: 1.2rem; margin: 5px 0; color: #94a3b8; }
        canvas { background: #1e293b; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); width: 100%; aspect-ratio: 1; cursor: pointer; touch-action: none; outline: none; }
        canvas:focus { ring: 4px solid #818cf8; border: 2px solid #818cf8; }
        #ui-layer { width: 100%; display: flex; justify-content: space-between; margin-top: 15px; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: transform 0.1s, background 0.2s; outline-color: #818cf8; }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; }
        .btn-secondary { background: #334155; color: #cbd5e1; }
        .btn-secondary:hover { background: #475569; }
        button:active { transform: scale(0.98); }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <h1>HEXA-MATCH</h1>
        <div id="score-board" aria-live="polite">Score: <span id="score-val">0</span> | Moves: <span id="moves-val">20</span></div>
    </header>

    <!-- Accessible canvas with tab index and roles -->
    <canvas id="gameCanvas" width="500" height="500" tabindex="0" role="application" aria-label="Hexa-Match Game Grid. Use arrow keys to navigate the tile selector, Space or Enter to clear matching blocks."></canvas>

    <!-- Screen-reader announcements -->
    <div id="announcer" class="sr-only" aria-live="assertive"></div>

    <div id="ui-layer">
        <button class="btn-secondary" onclick="resetGame()">Reset Game</button>
        <button class="btn-primary" onclick="shareChallenge()">Challenge a Friend 🚀</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const movesVal = document.getElementById('moves-val');
    const announcer = document.getElementById('announcer');

    let score = 0;
    let moves = 20;
    const size = 5; 
    let grid = [];
    const colors = ['#f43f5e', '#0ea5e9', '#10b981', '#eab308']; 

    // Accessibility Navigation Coordinates
    let cursorX = 0;
    let cursorY = 0;
    let isKeyboardUser = false;

    function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const challengeScore = urlParams.get('challenge');
        if(challengeScore) {
            announce(`You have been challenged to beat a score of ${challengeScore}`);
            setTimeout(() => { alert(`🔥 Challenge Received! Try to beat: ${challengeScore} points!`); }, 100);
        }

        grid = [];
        for (let r = 0; r < size; r++) {
            grid[r] = [];
            for (let c = 0; c < size; c++) {
                grid[r][c] = colors[Math.floor(Math.random() * colors.length)];
            }
        }
        drawGrid();
    }

    function announce(text) {
        announcer.textContent = text;
    }

    function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const tileWidth = 64;
        const tileHeight = 32;
        const originX = canvas.width / 2;
        const originY = 120;

        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (!grid[r][c]) continue;

                const isoX = originX + (c - r) * (tileWidth / 2);
                const isoY = originY + (c + r) * (tileHeight / 2);

                drawIsoBlock(isoX, isoY, tileWidth, tileHeight, grid[r][c]);

                // Draw Accessibility Target Highlight Box if Keyboard Mode active
                if (isKeyboardUser && r === cursorY && c === cursorX) {
                    ctx.beginPath();
                    ctx.moveTo(isoX, isoY - 2);
                    ctx.lineTo(isoX + tileWidth/2 + 2, isoY + tileHeight/2);
                    ctx.lineTo(isoX, isoY + tileHeight + 2);
                    ctx.lineTo(isoX - tileWidth/2 - 2, isoY + tileHeight/2);
                    ctx.closePath();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }
        }
    }

    function drawIsoBlock(x, y, w, h, color) {
        ctx.lineWidth = 1;
        // Top Face
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + w / 2, y + h / 2);
        ctx.lineTo(x, y + h);
        ctx.lineTo(x - w / 2, y + h / 2);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#1e293b';
        ctx.stroke();

        // Left Face
        ctx.beginPath();
        ctx.moveTo(x - w / 2, y + h / 2);
        ctx.lineTo(x, y + h);
        ctx.lineTo(x, y + h + 20);
        ctx.lineTo(x - w / 2, y + h / 2 + 20);
        ctx.closePath();
        ctx.fillStyle = adjustBrightness(color, -20);
        ctx.fill();
        ctx.stroke();

        // Right Face
        ctx.beginPath();
        ctx.moveTo(x, y + h);
        ctx.lineTo(x + w / 2, y + h / 2);
        ctx.lineTo(x + w / 2, y + h / 2 + 20);
        ctx.lineTo(x, y + h + 20);
        ctx.closePath();
        ctx.fillStyle = adjustBrightness(color, -40);
        ctx.fill();
        ctx.stroke();
    }

    // Pointer-click interaction logic
    canvas.addEventListener('click', function(e) {
        isKeyboardUser = false;
        if (moves <= 0) return;

        const rect = canvas.getBoundingClientRect();
        const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

        const tileWidth = 64;
        const tileHeight = 32;
        const originX = canvas.width / 2;
        const originY = 120;

        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const isoX = originX + (c - r) * (tileWidth / 2);
                const isoY = originY + (c + r) * (tileHeight / 2);

                if (Math.abs(clickX - isoX) < tileWidth / 2 && clickY > isoY && clickY < isoY + tileHeight + 20) {
                    executeMatch(r, c);
                    return;
                }
            }
        }
    });

    // Keyboard controls for A11y
    canvas.addEventListener('keydown', function(e) {
        isKeyboardUser = true;
        let keysHandled = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter'];
        if (!keysHandled.includes(e.key)) return;
        
        e.preventDefault(); 

        if (e.key === 'ArrowUp' && cursorY > 0) cursorY--;
        if (e.key === 'ArrowDown' && cursorY < size - 1) cursorY++;
        if (e.key === 'ArrowLeft' && cursorX > 0) cursorX--;
        if (e.key === 'ArrowRight' && cursorX < size - 1) cursorX++;
        
        if (e.key === ' ' || e.key === 'Enter') {
            executeMatch(cursorY, cursorX);
        }
        
        drawGrid();
    });

    function executeMatch(r, c) {
        if (moves <= 0) return;
        const targetColor = grid[r][c];
        if (!targetColor) return;

        let matches = [];
        findConnected(r, c, targetColor, matches);

        if (matches.length >= 2) {
            const pointsEarned = matches.length * 10;
            score += pointsEarned;
            moves--;
            scoreVal.innerText = score;
            movesVal.innerText = moves;

            announce(`Cleared ${matches.length} blocks. Earned ${pointsEarned} points. Remaining moves: ${moves}`);

            matches.forEach(m => grid[m.r][m.c] = null);
            applyGravity();
            drawGrid();

            if (moves === 0) {
                announce(`Game Over! Your final score is ${score}`);
                setTimeout(() => { alert(`Game Over! Final Score: ${score}`); }, 200);
            }
        } else {
            announce("No match found. Select a block touching matching colors.");
        }
    }

    function findConnected(r, c, color, matches) {
        if (r < 0 || r >= size || c < 0 || c >= size || !grid[r][c] || grid[r][c] !== color) return;
        if (matches.some(m => m.r === r && m.c === c)) return;

        matches.push({r, c});

        findConnected(r + 1, c, color, matches);
        findConnected(r - 1, c, color, matches);
        findConnected(r, c + 1, color, matches);
        findConnected(r, c - 1, color, matches);
    }

    function applyGravity() {
        for (let c = 0; c < size; c++) {
            let emptyRow = size - 1;
            for (let r = size - 1; r >= 0; r--) {
                if (grid[r][c] !== null) {
                    let temp = grid[r][c];
                    grid[r][c] = null;
                    grid[emptyRow][c] = temp;
                    emptyRow--;
                }
            }
            for (let r = emptyRow; r >= 0; r--) {
                grid[r][c] = colors[Math.floor(Math.random() * colors.length)];
            }
        }
    }

    function adjustBrightness(hex, percent) {
        let R = parseInt(hex.substring(1,3),16);
        let G = parseInt(hex.substring(3,5),16);
        let B = parseInt(hex.substring(5,7),16);
        R = parseInt(R * (100 + percent) / 100);
        G = parseInt(G * (100 + percent) / 100);
        B = parseInt(B * (100 + percent) / 100);
        return `#${(((1 << 24) + ((R<255?R:255) << 16) + ((G<255?G:255) << 8) + (B<255?B:255)).toString(16).slice(1))}`;
    }

    function resetGame() {
        score = 0;
        moves = 20;
        scoreVal.innerText = score;
        movesVal.innerText = moves;
        cursorX = 0;
        cursorY = 0;
        init();
        announce("Game has been reset.");
    }

    function shareChallenge() {
        const gameUrl = window.location.href.split('?')[0];
        const challengeUrl = `${gameUrl}?challenge=${score}`;
        
        navigator.clipboard.writeText(challengeUrl).then(() => {
            alert("🚀 Challenge link copied! Share it with a friend to see if they can beat your score!");
        }).catch(() => {
            alert("Could not auto-copy. Copy your browser URL to share!");
        });
    }

    init();
</script>
</body>
</html>
